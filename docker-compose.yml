services:
  db:
    image: postgres:16-alpine
    container_name: classplan-db
    environment:
      POSTGRES_USER: classplan
      POSTGRES_PASSWORD: classplan
      POSTGRES_DB: classplan
    ports:
      - "5432:5432"
    volumes:
      - classplan-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classplan -d classplan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  classplan-data:
